[package]
name = "cc-capture"
description = "Camera enumeration and capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cc-core.workspace = true
tracing.workspace = true

# nokhwa's AVFoundation backend fails to enumerate formats on common cameras,
# so macOS uses a direct AVFoundation implementation instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
nokhwa.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = { version = "=0.6.5", features = ["exception"] }
objc2-av-foundation = { version = "=0.3.2", features = ["objc2-core-media", "block2", "dispatch2"] }
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSValue"] }

[lints]
workspace = true
