[package]
name = "cc-virtualcam"
description = "Virtual camera outputs (v4l2loopback, CoreMediaIO extension, Media Foundation)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cc-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSError", "NSObject"] }
objc2-system-extensions = "=0.3.2"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
cc-vcam-protocol.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }
