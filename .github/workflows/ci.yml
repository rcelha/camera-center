name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Dependency audit. deny.toml's [graph] targets cover all three platforms, so
  # one Linux run audits every OS's dependency tree; it needs no compilation.
  deny:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: 1.95.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: cargo-deny
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny
        run: just deny

  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, build: build-osx }
          - { name: Linux, os: ubuntu-24.04, build: build-linux }
          - { name: Windows, os: windows-2025, build: build-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libv4l-dev libudev-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libgtk-3-dev nasm \
            libayatana-appindicator3-dev libxdo-dev
      - name: Lint and type-check
        shell: bash
        run: just lint
      - name: Test
        shell: bash
        run: just test
      - name: Build
        shell: bash
        run: just ${{ matrix.build }}
